name: Engineering Evidence Gate

on:
  push:
    branches:
      - main
      - engineering/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic control tests
        run: python -m unittest discover -s tests -v

      - name: Validate requirements and evidence ledger
        run: python tools/validate_evidence.py
