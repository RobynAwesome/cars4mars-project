name: Engineering Evidence Gate

on:
  push:
    branches:
      - main
      - engineering/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic software tests
        run: python -m unittest discover -s tests -v

      - name: Compile and run embedded protocol golden vector
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror firmware/teensy/native_test.cpp -o /tmp/c4m_protocol_test
          /tmp/c4m_protocol_test

      - name: Compile and run embedded safety core
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror firmware/teensy/native_safety_test.cpp -o /tmp/c4m_safety_test
          /tmp/c4m_safety_test

      - name: Compile and run embedded command processor
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror firmware/teensy/native_processor_test.cpp -o /tmp/c4m_processor_test
          /tmp/c4m_processor_test

      - name: Validate requirements and evidence ledger
        run: python tools/validate_evidence.py
