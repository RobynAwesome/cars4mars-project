name: Engineering Evidence Gate

on:
  push:
    branches:
      - main
      - engineering/**
      - agent/hardware-math-staging
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic software tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic rover simulations
        run: |
          rm -rf /tmp/cars4mars-sim
          python tools/run_simulations.py --out /tmp/cars4mars-sim
          test -s /tmp/cars4mars-sim/scenario_contract.json
          test -s /tmp/cars4mars-sim/grade45-ideal-lower-bound.json
          test -s /tmp/cars4mars-sim/grade45-lossy-hypothesis.json
          test -s /tmp/cars4mars-sim/grade45-traction-limited.json
          test -s /tmp/cars4mars-sim/heartbeat-loss-stop-envelope.json
          test -s /tmp/cars4mars-sim/grade45-sensitivity.json

      - name: Run bounded uncertainty tranche
        run: |
          rm -rf /tmp/cars4mars-uncertainty
          python tools/run_uncertainty_tranche.py --out /tmp/cars4mars-uncertainty/uncertainty-tranche.json
          test -s /tmp/cars4mars-uncertainty/uncertainty-tranche.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/cars4mars-uncertainty/uncertainty-tranche.json'))
          assert p['mode']=='BOUNDED_UNCERTAINTY_ONLY'
          assert p['hard_invariant']=='MODEL PASS != PHYSICAL PASS'
          assert set(p['sections']) == {
              'drivetrain_grade_45deg',
              'watchdog_stop_envelope',
              'static_cross_slope_stability',
              'payload_retention_demand',
          }
          allowed={'ROBUST_PASS','MIXED_HOLD','ROBUST_FAIL'}
          assert all(s['classification'] in allowed for s in p['sections'].values())
          assert p['physical_validation_measurements_remaining']
          PY

      - name: Compile and run embedded protocol golden vector
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror firmware/teensy/native_test.cpp -o /tmp/c4m_protocol_test
          /tmp/c4m_protocol_test

      - name: Compile and run embedded safety core
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror firmware/teensy/native_safety_test.cpp -o /tmp/c4m_safety_test
          /tmp/c4m_safety_test

      - name: Compile and run embedded command processor
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror firmware/teensy/native_processor_test.cpp -o /tmp/c4m_processor_test
          /tmp/c4m_processor_test

      - name: Validate requirements and evidence ledger
        run: python tools/validate_evidence.py

      - name: Validate engineering challenge matrix
        run: python tools/validate_challenge_matrix.py
